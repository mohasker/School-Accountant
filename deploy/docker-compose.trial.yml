# Practical-trial server: the trial (synthetic data, shared «زائر» account) behind HTTPS on a domain.
# Installed by deploy/install-trial.sh; on its own:
#   docker compose -f deploy/docker-compose.trial.yml --env-file .env up --build -d
# The trial keeps its data in the `trial_data` volume across restarts and updates.
name: moesas-trial
services:
  trial:
    build:
      context: ..
      args:
        WITH_CLAMAV: 'false'
    command: npm run demo
    environment:
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      TRIAL_GUEST_PASSWORD: ${TRIAL_GUEST_PASSWORD:-112233}
      SECRETS_KEY: ${SECRETS_KEY:-}
      TRUST_PROXY: '1'
      WEB_HOST: 0.0.0.0
    volumes:
      - trial_data:/app/.data
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
      UPSTREAM: trial:3000
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - trial
    restart: unless-stopped
volumes:
  trial_data:
  caddy_data:
