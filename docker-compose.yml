services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: school_accounting
    volumes:
      - school_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U school -d school_accounting']
      interval: 5s
      retries: 15
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://school:${DB_PASSWORD}@db:5432/school_accounting
    command: npm run db:deploy
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://school:${DB_PASSWORD}@db:5432/school_accounting
      HOST: 0.0.0.0
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: npm run start:api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
  web:
    build: .
    environment:
      API_URL: http://api:3001
      NODE_ENV: ${NODE_ENV:-development}
    command: npm run start:web
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
volumes:
  school_db:
